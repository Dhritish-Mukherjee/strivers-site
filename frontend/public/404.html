<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Out of Syllabus | Strivers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-paper: #FFF3E2;
        --color-ink: #111111;
        --color-accent: #FF3B00;
        --color-yellow: #FFEA00;
        --shadow-brutal: 8px 8px 0px var(--color-ink);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--color-paper);
        color: var(--color-ink);
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background: #ffffff;
        border: 4px solid var(--color-ink);
        box-shadow: var(--shadow-brutal);
        padding: clamp(2rem, 5vw, 4rem);
        max-width: 650px;
        width: 100%;
        text-align: center;
        position: relative;
      }
      .badge {
        display: inline-block;
        background: var(--color-accent);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.35rem 0.75rem;
        border: 2px solid var(--color-ink);
        box-shadow: 2px 2px 0px var(--color-ink);
        margin-bottom: 1.5rem;
      }
      .num {
        font-family: 'Inter', sans-serif;
        font-size: clamp(4.5rem, 14vw, 8rem);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.05em;
        color: var(--color-ink);
        text-shadow: 4px 4px 0px var(--color-yellow), 8px 8px 0px var(--color-ink);
        margin-bottom: 1rem;
      }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 1rem;
      }
      p {
        color: #4a4a4a;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        background: var(--color-accent);
        color: #fff;
        font-weight: 800;
        text-decoration: none;
        padding: 0.8rem 1.8rem;
        border: 3px solid var(--color-ink);
        box-shadow: 4px 4px 0px var(--color-ink);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px var(--color-ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404: Page Out of Syllabus</div>
      <div class="num">404</div>
      <h1>Looks like this concept was deleted from the syllabus!</h1>
      <p>The page you are looking for has vanished into thin air or never existed in the exam curriculum. Let's get you back to your study schedule.</p>
      <a href="/" class="btn">Return to Homepage 🏠</a>
    </div>
    <script>
      // If deployed as SPA on static server that serves 404.html, redirect to path
      const path = window.location.pathname;
      if (path && path !== '/404.html' && path !== '/404') {
        window.location.replace('/#' + path);
      }
    </script>
  </body>
</html>
